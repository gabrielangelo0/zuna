<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zuna · Painel</title>
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#0a0f2c" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/src/admin/admin.css" />
  </head>
  <body>
    <header class="top">
      <h1>Zuna <span>painel</span></h1>
      <div class="who">
        <span id="admin-user"></span>
        <button id="admin-logout" type="button" class="ghost" hidden>Sair</button>
      </div>
    </header>

    <main>
      <section id="login" class="card" hidden>
        <h2>Entrar</h2>
        <p class="muted">Use a conta do jogo que tem acesso de administrador.</p>
        <form id="login-form" class="stack">
          <input id="login-user" placeholder="Usuário" autocomplete="username" autocapitalize="off" spellcheck="false" />
          <input id="login-pass" type="password" placeholder="Senha" autocomplete="current-password" />
          <button class="primary" type="submit">Entrar</button>
        </form>
        <p id="login-error" class="error" hidden></p>
      </section>

      <section id="panel" hidden>
        <nav class="tabs">
          <button type="button" class="tab active" data-view="players">Jogadores</button>
          <button type="button" class="tab" data-view="log">Histórico</button>
        </nav>

        <div id="view-players">
          <div class="toolbar">
            <input id="search" placeholder="Buscar por conta ou personagem" />
            <button id="reload" class="ghost" type="button">Atualizar</button>
            <span id="total" class="muted"></span>
          </div>
          <div class="table-wrap">
            <table id="players">
              <thead>
                <tr>
                  <th>Conta</th>
                  <th>Personagem</th>
                  <th>Nível</th>
                  <th>XP</th>
                  <th>Ouro</th>
                  <th>Diamantes</th>
                  <th>Caçadas</th>
                  <th>Classe</th>
                  <th>Ações</th>
                </tr>
              </thead>
              <tbody id="players-body"></tbody>
            </table>
          </div>
        </div>

        <div id="view-log" hidden>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Quando</th>
                  <th>Administrador</th>
                  <th>Ação</th>
                  <th>Alvo</th>
                  <th>Detalhe</th>
                </tr>
              </thead>
              <tbody id="log-body"></tbody>
            </table>
          </div>
        </div>
      </section>
    </main>

    <div id="toast" hidden></div>

    <script type="module" src="/src/admin/main.ts"></script>
  </body>
</html>
